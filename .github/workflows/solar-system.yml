name: Solar System Workflow

on:  
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container:
          image: node:20
        env:
          MONGO_URI: ${{ env.MONGO_URI }}
          MONGO_USERNAME: ${{ env.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ env.MONGO_PASSWORD }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        # - name: Setup NodeJS Version
        #   uses: actions/setup-node@v4
        #   with:
        #     node-version: 20
            
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-
      
        - name: Install Dependencies
          run: npm install
      
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: code-coverage
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 18

        - name: Install Dependencies
          run: npm install

        - name: Run Code-coverage
          run: npm run coverage
          continue-on-error: true

        - name: Upload Code-Coverage-Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
        needs: [unit-testing, code-coverage]
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Login to GitHub Container Registry
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Lowercase Repository Owner
            run: |
              echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

          - name: Build and push Docker image
            uses: docker/build-push-action@v5
            with:
              context: .
              push: true
              tags: ghcr.io/${{ env.LOWER_OWNER }}/solar-system:${{ github.sha }}

    dev-deploy:
        name: Development Deployment
        needs: docker
        runs-on: ubuntu-latest
        environment: development
        outputs:
          APP_INGRESS_URL: ${{ steps.deployment.outputs.app_ingress_url }}
        steps:
          - name: Install Kubernetes Cluster
            uses: helm/kind-action@v1

          - name: Run Deployment Script
            id: deployment
            run: |
              sleep 60
              kubectl -n kube-system get pods
              REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
              kubectl run solar --image ghcr.io/${REPO_OWNER_LC}/solar-system:${{ github.sha }} \
                 --env MONGO_URI="${{ env.MONGO_URI }}" \
                 --env MONGO_USERNAME="${{ env.MONGO_USERNAME }}" \
                 --env MONGO_PASSWORD="${{ env.MONGO_PASSWORD }}"
              set +e
              echo "kubectl returned $?"
              kubectl -n default get pods
              sleep 10
              echo "app_ingress_url=localhost" >> $GITHUB_OUTPUT

    integration-testing:
        needs: dev-deploy
        uses: ./.github/workflows/reusable-workflow.yml
        with:
          ingress-url: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}